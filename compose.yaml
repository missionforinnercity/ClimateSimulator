services:
  app:
    image: ${CONDITIONS_APP_IMAGE:-conditions-app:local}
    build: .
    environment:
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:8000}
      CONDITIONS_API_KEY: ${CONDITIONS_API_KEY:-}
      DATABASE_URL: ${DATABASE_URL:-}
      TOMTOM_API: ${TOMTOM_API:-}
      ERA5API: ${ERA5API:-}
      METEOSTAT_RAPIDAPI_KEY: ${METEOSTAT_RAPIDAPI_KEY:-}
      METEOBLUEAPI: ${METEOBLUEAPI:-}
      THERMAL_PRODUCT_ROOT: /var/lib/conditions-thermal
    volumes:
      - thermal-products:/var/lib/conditions-thermal:ro
      - ./data/thermal/climatology:/app/data/thermal/climatology:ro
    restart: unless-stopped

  thermal-worker:
    image: ${THERMAL_WORKER_IMAGE:-conditions-thermal-worker:local}
    build:
      context: .
      dockerfile: Dockerfile.thermal
    environment:
      METEOSTAT_RAPIDAPI_KEY: ${METEOSTAT_RAPIDAPI_KEY:-}
      METEOBLUEAPI: ${METEOBLUEAPI:-}
      THERMAL_PRODUCT_ROOT: /var/lib/conditions-thermal
      THERMAL_SURFACE_ROOT: /app/data/thermal/surfaces
      THERMAL_WIND_ATLAS_ROOT: /app/data/openfoam/atlas
      SUEWS_CONFIG: /app/data/thermal/suews/config.yml
    volumes:
      - thermal-products:/var/lib/conditions-thermal
      # This atlas is prepared offline; all worker writes go to the product volume.
      - ./data/openfoam/atlas:/app/data/openfoam/atlas:ro
    restart: unless-stopped

  web:
    image: nginx:1.29.1-alpine
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./public:/srv/public:ro
      - ./data/branding:/srv/branding:ro
    restart: unless-stopped

volumes:
  thermal-products:

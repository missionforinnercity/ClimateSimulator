map $arg_v $asset_cache_control {
    default "public, max-age=31536000, immutable";
    "" "public, max-age=0, must-revalidate";
}

server {
    listen 8080;
    server_name _;
    root /srv/public;
    absolute_redirect off;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types application/json application/javascript text/css text/plain;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

    location /api/ {
        proxy_pass http://app:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
    }

    location /assets/ {
        etag on;
        add_header Cache-Control $asset_cache_control;
        try_files $uri =404;
    }

    location /branding/ {
        alias /srv/branding/;
        expires 1h;
    }

    location / {
        add_header Cache-Control "no-store, max-age=0";
        try_files $uri $uri/ /index.html;
    }
}

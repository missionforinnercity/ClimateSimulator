name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.11"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install --upgrade pip==25.2
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - name: Check application JavaScript syntax
        run: find public -maxdepth 1 -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Validate generated asset manifest
        run: python -m pytest -q tests/test_city_model.py tests/test_roof_surface_asset.py tests/test_canopy_asset.py
